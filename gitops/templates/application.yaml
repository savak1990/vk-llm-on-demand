apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  # Name, release name and the chart namespace together fix the HTTPRoute
  # name (gpu-on-demand), the state ConfigMap name and the installationId
  # a later consumer recomputes. Never set helm.releaseName, never rename this.
  # The object lives in the app's own namespace, never in argocd: an
  # Application in the control-plane namespace may name any project.
  name: gpu-on-demand
  namespace: {{ .Values.namespace }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: vk-llm-on-demand
  source:
    repoURL: {{ .Values.charts.registry | quote }}
    chart: gpu-on-demand
    targetRevision: {{ .Values.chartVersion | quote }}
    helm:
      valuesObject:
        image:
          tag: {{ .Values.tag | quote }}
        host: {{ printf "%s.%s" .Values.hostPrefix .Values.fqdn | quote }}
        existingSecrets:
          provider: {{ .Values.secrets.provider | quote }}
          apiKeys: {{ .Values.secrets.apiKeys | quote }}
          ssh: {{ .Values.secrets.ssh | quote }}
        config:
          provider:
            filter:
              gpuName: {{ .Values.gpu | quote }}
          model:
            alias: {{ .Values.model.alias | quote }}
            url: {{ .Values.model.url | quote }}
            sha256: {{ .Values.model.sha256 | quote }}
          worker:
            image: {{ .Values.worker.image | quote }}
        httpRoute:
          enabled: true
        serviceMonitor:
          enabled: true
        prometheusRule:
          enabled: true
        dashboard:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: {{ .Values.namespace }}
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
