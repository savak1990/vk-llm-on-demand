# Set by the platform's helm parameter; never committed.
fqdn: ""
hostPrefix: llm
namespace: llm

# The one place versions are pinned. Both come from the same commit so the
# chart and the image it runs always match.
charts:
  registry: ghcr.io/savak1990/vk-llm-on-demand/charts
chartVersion: "0.1.1-main.0ab826b"
tag: "0ab826b66c19bde932507c53949ba7ad1524efe8"

# Secrets the platform renders into namespace llm (vk-lab-platform
# gitops/templates/platform/shared/llm/secrets.yaml). The chart mounts them
# by name; it never creates them.
secrets:
  provider: vast-ai-api-key
  apiKeys: vk-llm-api-token
  ssh: vk-llm-ssh-key

# Pinned from the official ggml-org GGUF repository; the chart has no
# default on purpose. Q8_0 is the largest quantization that fits a 48 GB GPU.
model:
  alias: qwen3.8-27b
  url: https://huggingface.co/ggml-org/Qwen3.8-27B-GGUF/resolve/main/Qwen3.8-27B-Q8_0.gguf
  sha256: 6bc9e7220d8400574fd62df25f04a961cb5cbb0d766cf0118c21c36c0059c35a
worker:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda@sha256:0a9f6c7cfe5a6b90b6c048b7a86865bf55a88af34bada927482eab2ef5f25b4a
