# Set by the platform's helm parameter; never committed.
fqdn: ""
hostPrefix: llm
namespace: llm
project: vk-llm-on-demand
modelAliasPrefix: ""

monitoring:
  alertRules: true
  dashboard: true
smokeTest:
  enabled: false

# The one place the version is pinned. The chart runs the image published
# under its own version, so the two always match.
charts:
  registry: ghcr.io/savak1990/vk-llm-on-demand/charts
chartVersion: "0.4.4"

# Secrets the platform renders into namespace llm (vk-lab-platform
# gitops/templates/platform/shared/llm/secrets.yaml). The chart mounts them
# by name; it never creates them.
secrets:
  provider: vast-ai-api-key
  apiKeys: vk-llm-api-token
  ssh: vk-llm-ssh-key

# Pinned from the official ggml-org GGUF repository; the chart has no
# default on purpose. Text only: the vision projector is not downloaded.
model:
  alias: inkling-2-mini
  url: https://huggingface.co/ggml-org/Inkling-2-Mini-GGUF/resolve/main/Inkling-2-Mini-Q8_0.gguf
  sha256: d57542f8aea5d7639beba5fc4ae7f584754916f63ac5d5a69328c27f652f45da
  # Estimate: 27.8 GB weights + about 9 GB q8_0 KV for 4 x 131072 tokens.
  # Confirm in the Vast console after the first start.
  contextSize: 131072
  parallel: 4
  kCacheType: q8_0
  vCacheType: q8_0
# Vast.ai gpu_name, exact string. 48 GB, same generation as L40S, cheaper median price.
gpu: RTX 6000Ada

# A chat message to a stopped GPU starts it, so any valid inference key can
# spend up to the monthly budget. explicit restores manual start only.
provisioningMode: on-demand

worker:
  image: ghcr.io/ggml-org/llama.cpp:server-cuda-b12808@sha256:c94503b4e7839fcacebc7fd04b7cef66376dc15a38e50e221e73871241a12982

# Open WebUI sends no max_tokens, so the cap is the real output limit, and
# every household member shares its one key.
gateway:
  maxTokensCap: 16384
  rateLimitPerKeyRPM: 100
