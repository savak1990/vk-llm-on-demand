apiVersion: v1
kind: ConfigMap
metadata:
  name: searxng
data:
  settings.yml: |
    use_default_settings: true
    server:
      limiter: false
      image_proxy: false
    search:
      formats:
        - html
        - json
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: searxng
  template:
    metadata:
      labels:
        app.kubernetes.io/name: searxng
    spec:
      automountServiceAccountToken: false
      containers:
        - name: searxng
          image: {{ .Values.searxng.image }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # One worker is enough for a household; the image default of 5 idles near 500 MiB.
            - name: GRANIAN_WORKERS
              value: "1"
            # Per-pod value: SearXNG signs nothing that must survive a restart,
            # and it must never hold Open WebUI's session key.
            - name: SEARXNG_SECRET
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: settings
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
      volumes:
        - name: settings
          configMap:
            name: searxng
---
# ClusterIP only: no HTTPRoute ever points here.
apiVersion: v1
kind: Service
metadata:
  name: searxng
spec:
  selector:
    app.kubernetes.io/name: searxng
  ports:
    - name: http
      port: 8080
      targetPort: http
