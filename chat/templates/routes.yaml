{{- $host := printf "%s.%s" .Values.hostPrefix (required "fqdn is required" .Values.fqdn) }}
# After the Service in the same sync: a route whose backend is missing
# reports Degraded until the Service exists.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - {{ $host | quote }}
  rules:
    - backendRefs:
        - name: open-webui
          port: 80
---
# All /api/v1/auths/* endpoints. The longer prefix wins over the main route,
# so a cold page load (dozens of parallel assets) never meets the rate limit.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui-auth
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parentRefs:
    - name: platform-gateway
      namespace: envoy
      sectionName: https
  hostnames:
    - {{ $host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/auths/
      backendRefs:
        - name: open-webui
          port: 80
