# Set by the platform's helm parameter; never committed.
fqdn: ""
hostPrefix: chat

searxng:
  image: docker.io/searxng/searxng:2026.11.23-a7163d091@sha256:a7fc607aa6723f5a8982105bcc5ffba4d1b9fc7c6922a31a88d6e4cba49ef12a

open-webui:
  # Stable names: the routes here and the platform's traffic policies refer to them.
  fullnameOverride: open-webui
  ollama:
    enabled: false
  pipelines:
    enabled: false
  tika:
    enabled: false
  # In-memory websocket manager: one replica needs no Redis.
  websocket:
    enabled: true
    manager: ""
    redis:
      enabled: false
  persistence:
    enabled: false
  # One replica, one database: an upgrade must never run two pods
  # against the same migrations.
  strategy:
    type: Recreate
  readinessProbe:
    httpGet:
      path: /health
      port: http
  startupProbe:
    httpGet:
      path: /health
      port: http
    periodSeconds: 10
    failureThreshold: 30
  image:
    tag: v0.13.4-slim
  # The slim image ships /app/backend/data empty, so the chart's default
  # `cp data/*` finds nothing to glob and the init container fails.
  copyAppData:
    command:
      - sh
      - -c
      - if [ -d /app/backend/data ]; then cp -R -n /app/backend/data/. /tmp/app-data/; fi
  resources:
    requests:
      cpu: 25m
      memory: 256Mi
    limits:
      memory: 768Mi
  logging:
    level: info
  enableOpenaiApi: true
  # Production first, then dev; the platform's OPENAI_API_KEYS lists one key per URL in this order.
  openaiBaseApiUrl: ""
  openaiBaseApiUrls:
    - http://gpu-on-demand.llm.svc/v1
    - http://gpu-on-demand.llm-dev.svc/v1
  openaiApiKeysExistingSecret: open-webui-env
  openaiApiKeysExistingSecretKey: OPENAI_API_KEYS
  extraEnvFrom:
    - secretRef:
        name: open-webui-env
    - configMapRef:
        name: open-webui-config
  extraEnvVars:
    # Must equal gitops/values.yaml model.alias (make gitops-check). In the pod
    # spec, not a ConfigMap, so a model change rolls the pod.
    - name: DEFAULT_MODELS
      value: inkling-2-mini
    - name: ENABLE_PERSISTENT_CONFIG
      value: "false"
    - name: ENABLE_SIGNUP
      value: "false"
    - name: ENABLE_TITLE_GENERATION
      value: "true"
    - name: ENABLE_SEARCH_QUERY_GENERATION
      value: "true"
    - name: ENABLE_TAGS_GENERATION
      value: "false"
    - name: ENABLE_FOLLOW_UP_GENERATION
      value: "false"
    - name: ENABLE_AUTOCOMPLETE_GENERATION
      value: "false"
    - name: ENABLE_WEB_SEARCH
      value: "true"
    - name: WEB_SEARCH_ENGINE
      value: searxng
    - name: SEARXNG_QUERY_URL
      value: "http://searxng.chat.svc:8080/search?q=<query>"
    - name: WEB_SEARCH_RESULT_COUNT
      value: "3"
    - name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL
      value: "true"
    - name: RAG_EMBEDDING_ENGINE
      value: openai
    # Unset, Open WebUI's RAG call falls back to the public OpenAI API,
    # not the base URL list; pin it to production explicitly.
    - name: RAG_OPENAI_API_BASE_URL
      value: http://gpu-on-demand.llm.svc/v1
    - name: USER_PERMISSIONS_CHAT_FILE_UPLOAD
      value: "false"
    - name: ENABLE_API_KEYS
      value: "false"
    - name: USER_PERMISSIONS_FEATURES_API_KEYS
      value: "false"
    # Google sign-in creates the account as pending; the admin activates it.
    # An account with the same email is linked, not refused as taken.
    - name: ENABLE_OAUTH_SIGNUP
      value: "true"
    - name: DEFAULT_USER_ROLE
      value: pending
    - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
      value: "true"
    # The admin's email/password login stays as break-glass.
    - name: ENABLE_LOGIN_FORM
      value: "true"
    # Without it a model with no access entry is admin-only, and every model
    # rename hides the chat model from all users until an admin edits it.
    - name: BYPASS_MODEL_ACCESS_CONTROL
      value: "true"
