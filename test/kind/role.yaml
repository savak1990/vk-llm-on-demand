apiVersion: v1
kind: ServiceAccount
metadata:
  name: vkllm-state-test
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vkllm-state-test
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vkllm-state"]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vkllm-state-test
subjects:
  - kind: ServiceAccount
    name: vkllm-state-test
roleRef:
  kind: Role
  name: vkllm-state-test
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vkllm-state
