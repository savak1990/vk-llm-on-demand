{{- if .Values.externalSecrets.enabled }}
{{- $prefix := required "externalSecrets.prefix is required when externalSecrets.enabled" .Values.externalSecrets.prefix }}
{{- $store := required "externalSecrets.storeRef is required when externalSecrets.enabled" .Values.externalSecrets.storeRef }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "svc.fullname" .) "vast-api-key" }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.existingSecrets.provider }}
  data:
    - secretKey: VAST_API_KEY
      remoteRef:
        key: {{ printf "%s/vast-api-key" $prefix }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "svc.fullname" .) "api-keys" }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.existingSecrets.apiKeys }}
  data:
    - secretKey: client-keys
      remoteRef:
        key: {{ printf "%s/client-keys" $prefix }}
    - secretKey: management-tokens
      remoteRef:
        key: {{ printf "%s/management-tokens" $prefix }}
    - secretKey: worker-seed
      remoteRef:
        key: {{ printf "%s/worker-seed" $prefix }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-%s" (include "svc.fullname" .) "ssh-private-key" }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  secretStoreRef:
    name: {{ $store }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.existingSecrets.ssh }}
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: {{ printf "%s/ssh-private-key" $prefix }}
{{- end }}
