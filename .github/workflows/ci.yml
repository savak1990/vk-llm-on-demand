# Every action below is pinned to a full commit SHA, not a tag, because a tag
# can be moved to read secrets out of a pipeline. No workflow-level `paths`
# filter: a skipped workflow reports no checks, so a required context waits forever.
name: ci

on:
  pull_request:

permissions: {}

jobs:
  # Decides which jobs below do real work. No checkout: on a pull_request
  # event the filter reads the diff through the API.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    concurrency:
      group: ci-changes-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    outputs:
      go: ${{ steps.filter.outputs.go }}
      helm: ${{ steps.filter.outputs.helm }}
      workflows: ${{ steps.filter.outputs.workflows }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'
              - 'deploy/docker/gpu-on-demand.Dockerfile'
              - 'Makefile'
              - 'test/kind/**'
            helm:
              - 'deploy/helm/**'
              - 'test/kind/**'
              - 'scripts/check-rbac.sh'
            workflows:
              - '.github/**'
            cli:
              - 'cmd/vk-llm/**'
              - '.goreleaser.yaml'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-go-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make go-build

      - run: make go-test

      # shellcheck ships preinstalled on ubuntu-latest.
      - run: make lint-worker-script

      # The version matches the one developers run locally.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

  image:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ci-image-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build both architectures without pushing, so a broken Dockerfile fails
      # the pull request instead of the release.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/gpu-on-demand.Dockerfile
          platforms: linux/amd64,linux/arm64
          provenance: false
          push: false
          cache-from: type=gha,scope=gpu-on-demand
          cache-to: type=gha,mode=max,scope=gpu-on-demand

  helm:
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-helm-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      # The version comes from the tag history, so the tags must be here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: 0.8.0
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          curl -sSLo kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - run: make helm-lint

      - name: Check RBAC Role shape
        run: ./scripts/check-rbac.sh

      - name: Render and validate the chart
        run: |
          set -euo pipefail
          make -s helm-template > rendered.yaml
          kubeconform -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml

      # Packaging at the pull request's own version is what proves the version
      # override works before a merge depends on it.
      - name: Package the chart at the pull request version
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh pr "${{ github.event.number }}" "${{ github.event.pull_request.head.sha }}")"
          make helm-package VERSION="$version"
          ls dist/

  store-kind:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-store-kind-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1

      - name: Apply the test RBAC fixture
        run: kubectl apply -f test/kind/role.yaml

      - name: Mint a token and export cluster connection details
        run: |
          set -euo pipefail
          echo "KIND_TOKEN=$(kubectl create token vkllm-state-test --duration=10m)" >> "$GITHUB_ENV"
          echo "KIND_API_SERVER=$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}')" >> "$GITHUB_ENV"
          kubectl config view --minify --raw -o jsonpath='{.clusters[0].cluster.certificate-authority-data}' | base64 -d > ca.crt
          echo "KIND_CA_PATH=$PWD/ca.crt" >> "$GITHUB_ENV"

      - name: Write the token to a file (the client reads a path, not an env var)
        run: echo -n "$KIND_TOKEN" > token && echo "KIND_TOKEN_PATH=$PWD/token" >> "$GITHUB_ENV"

      - run: go test -tags integration ./internal/store/... -count=1 -run 'TestKind' -v

  # Drives the real control plane against a real kind cluster: the fake
  # provider and a direct tunnel to a fake-worker Deployment stand in for
  # Vast.ai and llama-server, so no GPU or network egress is needed.
  chart-kind:
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-chart-kind-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local images
        run: |
          set -euo pipefail
          make image-build SVC=gpu-on-demand IMAGE_TAG=citest
          make image-build SVC=fake-worker IMAGE_TAG=citest

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0

      - name: Install promtool
        env:
          PROMETHEUS_VERSION: "3.16.0"
          PROMETHEUS_SHA256: 68727009472a2c02e1ff7f062fd5b3e637285bffc8fc2d340c76fb449d6e0f34
        run: |
          set -euo pipefail
          curl -sSLo prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          echo "${PROMETHEUS_SHA256}  prometheus.tar.gz" | sha256sum -c -
          tar xzf prometheus.tar.gz
          sudo mv "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/promtool

      - name: promtool check/test rules
        run: |
          set -euo pipefail
          promtool check rules deploy/helm/gpu-on-demand/files/alerts.yaml
          cd deploy/helm/gpu-on-demand/files && promtool test rules alerts_test.yaml

      # A named cluster, because the default kind context is "kind", not
      # this action's own default of "chart-testing": the load step below
      # must target the same name this creates.
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          cluster_name: citest

      - name: Load images into the kind node
        run: |
          set -euo pipefail
          kind load docker-image ghcr.io/savak1990/vk-llm-on-demand/gpu-on-demand:citest --name citest
          kind load docker-image ghcr.io/savak1990/vk-llm-on-demand/fake-worker:citest --name citest

      - name: Create the fixture Secrets and the fake-worker Deployment
        run: |
          set -euo pipefail
          kubectl create secret generic provider-secret --from-literal=VAST_API_KEY=x
          kubectl create secret generic api-keys-secret \
            --from-literal=client-keys=sk-vkllm-citestclientkey \
            --from-literal=management-tokens=sk-vkllm-citestmgmttoken \
            --from-literal=worker-seed=citest-worker-seed-0123456789abc
          ssh-keygen -t ed25519 -N "" -f id_ed25519
          kubectl create secret generic ssh-secret --from-file=id_ed25519
          kubectl create deployment fake-worker --image=ghcr.io/savak1990/vk-llm-on-demand/fake-worker:citest --port=8080
          kubectl expose deployment fake-worker --port=8080
          kubectl wait --for=condition=Available deployment/fake-worker --timeout=60s

      # kind has no prometheus-operator installed; PrometheusRule needs only
      # its CRD registered for helm install to apply one, not the operator.
      - name: Install the PrometheusRule CRD
        run: |
          set -euo pipefail
          kubectl apply --server-side -f \
            "https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/v0.95.1/example/prometheus-operator-crd/monitoring.coreos.com_prometheusrules.yaml"

      - name: helm install
        run: |
          set -euo pipefail
          helm install gpu-on-demand deploy/helm/gpu-on-demand \
            --set image.tag=citest --set image.pullPolicy=Never \
            --set config.provider.name=fake \
            --set config.tunnel.dialer=direct --set config.tunnel.directAddr=fake-worker.default.svc.cluster.local:8080 \
            --set config.model.url=https://example.com/m.gguf \
            --set config.model.sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set config.worker.image=example/worker \
            --set existingSecrets.provider=provider-secret \
            --set existingSecrets.apiKeys=api-keys-secret \
            --set existingSecrets.ssh=ssh-secret \
            --set prometheusRule.enabled=true --set dashboard.enabled=true

      - name: Wait for Ready with no GPU running
        run: |
          set -euo pipefail
          kubectl rollout status deployment/gpu-on-demand --timeout=60s
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/instance=gpu-on-demand --timeout=60s

      - name: Confirm initial state is STOPPED
        run: |
          set -euo pipefail
          kubectl port-forward svc/gpu-on-demand 18080:80 >/dev/null 2>&1 &
          sleep 2
          state=$(curl -sf -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/status | jq -r .state)
          test "$state" = "STOPPED"

      - name: Start, poll for Ready
        run: |
          set -euo pipefail
          curl -sf -X POST -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/start
          for _ in $(seq 1 30); do
            state=$(curl -sf -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/status | jq -r .state)
            [ "$state" = "READY" ] && break
            sleep 1
          done
          test "$state" = "READY"

      - name: Inference API reachable
        run: |
          set -euo pipefail
          curl -sf -H "Authorization: Bearer sk-vkllm-citestclientkey" http://localhost:18080/v1/models
          curl -sf -N -X POST -H "Authorization: Bearer sk-vkllm-citestclientkey" \
            -H "Content-Type: application/json" \
            -d '{"model":"qwen3.6-35b-a3b","messages":[{"role":"user","content":"hi"}],"stream":true}' \
            http://localhost:18080/v1/chat/completions | grep -q 'data: \[DONE\]'

      - name: Metrics endpoint reachable, catalog complete for the fake provider
        run: |
          set -euo pipefail
          kubectl port-forward svc/gpu-on-demand 19090:9090 >/dev/null 2>&1 &
          sleep 2
          for _ in $(seq 1 30); do
            count=$(curl -sf http://localhost:19090/metrics | grep -c '^# TYPE vkllm_')
            [ "$count" = "40" ] && break
            sleep 1
          done
          test "$count" = "40"
          kubectl get configmap -l grafana_dashboard=1 | grep -q dashboard-observability
          kubectl get prometheusrule gpu-on-demand

      - name: Stop, poll for STOPPED
        run: |
          set -euo pipefail
          curl -sf -X POST -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/stop
          for _ in $(seq 1 30); do
            state=$(curl -sf -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/status | jq -r .state)
            [ "$state" = "STOPPED" ] && break
            sleep 1
          done
          test "$state" = "STOPPED"

      - name: helm upgrade with a changed config value, confirm rollout and unchanged state
        run: |
          set -euo pipefail
          before=$(curl -sf -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/status | jq -r .installationId)
          state_before=$(kubectl get configmap gpu-on-demand-state -o jsonpath='{.data.state\.json}')
          test -n "$state_before"
          helm upgrade gpu-on-demand deploy/helm/gpu-on-demand \
            --set image.tag=citest --set image.pullPolicy=Never \
            --set config.provider.name=fake \
            --set config.tunnel.dialer=direct --set config.tunnel.directAddr=fake-worker.default.svc.cluster.local:8080 \
            --set config.lifecycle.idleShutdown.timeout=10m \
            --set config.model.url=https://example.com/m.gguf \
            --set config.model.sha256=e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855 \
            --set config.worker.image=example/worker \
            --set existingSecrets.provider=provider-secret \
            --set existingSecrets.apiKeys=api-keys-secret \
            --set existingSecrets.ssh=ssh-secret \
            --set prometheusRule.enabled=true --set dashboard.enabled=true
          kubectl rollout status deployment/gpu-on-demand --timeout=60s
          state_after=$(kubectl get configmap gpu-on-demand-state -o jsonpath='{.data.state\.json}')
          test -n "$state_after"
          test "$state_after" = "$state_before"
          pkill -f "port-forward svc/gpu-on-demand" || true
          kubectl port-forward svc/gpu-on-demand 18080:80 >/dev/null 2>&1 &
          sleep 2
          after=$(curl -sf -H "Authorization: Bearer sk-vkllm-citestmgmttoken" http://localhost:18080/api/v1/gpu/status | jq -r .installationId)
          test -n "$after"
          test "$after" = "$before"

      - name: helm uninstall, confirm no ConfigMap remains
        run: |
          set -euo pipefail
          helm uninstall gpu-on-demand
          if kubectl get configmap gpu-on-demand 2>/dev/null; then
            echo "gpu-on-demand ConfigMap must not survive uninstall" >&2
            exit 1
          fi
          if kubectl get configmap gpu-on-demand-state 2>/dev/null; then
            echo "gpu-on-demand-state ConfigMap must not survive uninstall" >&2
            exit 1
          fi

  worker-script:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-worker-script-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: make test-worker-script

  workflows:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-workflows-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          curl -sSLo actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - run: actionlint -color

  repo:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-repo-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - run: make specs-check

      - name: vastprobe is read-only
        run: |
          if grep -rE '(http\.MethodPut|http\.MethodDelete|"PUT"|"DELETE")' hack/vastprobe/; then
            echo "hack/vastprobe must never PUT or DELETE" >&2
            exit 1
          fi

  # Reserved for a future gitleaks/govulncheck/trivy scan. No step runs yet,
  # so this always succeeds; ci-ok still waits on it so a scan added later
  # blocks merges without widening this job's scope.
  security:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: ci-security-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - run: echo "no security scan wired up yet"

  cli:
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: ci-cli-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - run: go build ./cmd/vk-llm

      - run: go test ./cmd/vk-llm/... -count=1

      # No-op until a .goreleaser.yaml exists. go run pins a module version,
      # so no action SHA needs tracking; GOTOOLCHAIN=auto lets it fetch the
      # newer Go GoReleaser itself requires, overriding setup-go's "local".
      - name: GoReleaser snapshot
        if: hashFiles('.goreleaser.yaml') != ''
        env:
          GOTOOLCHAIN: auto
        run: go run github.com/goreleaser/goreleaser/v2@v2.19.0 release --snapshot --clean

  # The single required status check. `if: always()` keeps it from being
  # skipped when a needed job is skipped; `cancelled` must still fail it, or a
  # cancelled run would merge green.
  ci-ok:
    needs:
      - changes
      - go
      - image
      - helm
      - store-kind
      - chart-kind
      - worker-script
      - workflows
      - repo
      - security
      - cli
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
