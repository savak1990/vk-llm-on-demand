# Workflow_dispatch release: publishes clean versioned images and charts, then tags.
# Deploys nothing — the released version is pinned via pull request to vk-lab-platform.
name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: The release bump level
        required: true
        type: choice
        options: [patch, minor, major]

permissions: {}

# Same group as deploy.yml to serialize version schemes across both channels.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One version for the whole run. A release rebuilds nothing: every component
  # is copied from the image its own last change already published.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      # Version is derived from tag history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh release "$BUMP")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    secrets: inherit
    with:
      version: ${{ needs.version.outputs.version }}

  # Tag is written only after every artifact exists, so a failed publish
  # never leaves a tag naming a version nobody can pull.
  tag:
    needs: [version, publish]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"
          {
            echo "### Released \`v$VERSION\`"
            echo "Once CORE-130 lands \`gitops/values.yaml\`, pin it there"
            echo "then bump \`app.targetRevision\` in vk-lab-platform."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.19.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
