name: gpu-control
run-name: "gpu-control: ${{ inputs.target }} ${{ inputs.action }} ${{ inputs.monthly_usd }}"
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do to the GPU backend
        type: choice
        options: [start, status, stop, budget]
        default: status
      target:
        description: Which installation to act on
        type: choice
        options: [prod, dev]
        default: prod
      monthly_usd:
        description: New monthly budget in USD (budget action only; blank shows the current value)
        required: false
        type: string
permissions: {}
concurrency:
  group: gpu-control-${{ inputs.target }}
  cancel-in-progress: false
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: gpu-control
    permissions:
      contents: read
      id-token: write
    env:
      ACTION: ${{ inputs.action }}
      MONTHLY_USD: ${{ inputs.monthly_usd }}
      HOST_PREFIX: ${{ inputs.target == 'dev' && 'llm-dev' || 'llm' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Read the management token and the API host from SSM
        run: |
          set -euo pipefail
          value="$(aws ssm get-parameter --with-decryption \
            --name /vk-hetzner-lab/persistent/llm/management_tokens \
            --query Parameter.Value --output text)"
          fqdn="$(aws ssm get-parameter \
            --name /vk-hetzner-lab/bootstrap/route53/fqdn \
            --query Parameter.Value --output text)"
          # Masking covers one line only, and the env file would read a second
          # line as a new variable, so a multi-token value is refused.
          case "$value" in
            *$'\n'*) echo "::error::management_tokens holds more than one line; gpu-control needs exactly one token" >&2; exit 1 ;;
          esac
          test -n "$fqdn"
          echo "::add-mask::$fqdn"
          echo "::add-mask::$value"
          echo "VK_LLM_TOKEN=$value" >> "$GITHUB_ENV"
          echo "ENDPOINT=https://$HOST_PREFIX.$fqdn" >> "$GITHUB_ENV"

      - run: scripts/gpu-control.sh
