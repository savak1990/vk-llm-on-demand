# Publishes a prerelease on every merge to main and installs it into llm-dev; never llm.
# Cutting a release is release.yml, a separate button; every action here is pinned
# to a full commit SHA — see ci.yml for why.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "specs/**"
      - "gitops/**"

permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # One version for the whole run, and the decision of what to rebuild.
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.filter.outputs.go }}
    steps:
      # The version is derived from the tag history, so fetch all of it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: v
        run: |
          set -euo pipefail
          version="$(./scripts/version.sh main "${{ github.sha }}")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### Version \`$version\`" >> "$GITHUB_STEP_SUMMARY"

      # These decide one thing only: whether an image is rebuilt or copied
      # to the new tag. No job is skipped on them, so a path missing here
      # costs a redundant copy, never a missing artifact.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            go:
              - 'cmd/**'
              - 'internal/**'
              - 'go.mod'
              - 'go.sum'
              - 'deploy/docker/gpu-on-demand.Dockerfile'

  publish:
    needs: version
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      version: ${{ needs.version.outputs.version }}
      go: ${{ needs.version.outputs.go }}

  # Namespace llm-dev only: the credential has no RoleBinding in llm, which Argo owns.
  deploy-dev:
    needs: [version, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: gpu-control
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.0

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      # Exit 2 means the lab is torn down, a normal state: warn and stay green.
      - name: Deploy to llm-dev
        env:
          PROJECT_NAME: vk-hetzner-lab
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          status=0
          ./scripts/deploy-dev.sh "$VERSION" "$SHA" || status=$?
          if [ "$status" -eq 0 ]; then
            echo "### llm-dev is at \`$VERSION\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "$status" -eq 2 ]; then
            echo "### llm-dev was not updated: the cluster is not reachable" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::llm-dev was not updated: the cluster is not reachable. Run 'make up' in vk-lab-platform, then re-run this job."
            exit 0
          fi
          exit "$status"
